<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

  <title>Three Photos, Two Stories</title>

</head>

  <h1>Three Photos, Two Stories</h1>

    <button id="v1Begin">Beginning</button>
    <button id="v1Middle">Middle</button>
    <button id="v1End">End</button>
  </div>

  <div class="story">
    <h2>Version 2: The Nap</h2>
    <img src="images/photo3.jpg" id="image2" alt="Version 2 photo">

    <button id="v2Begin">Beginning</button>
    <button id="v2Middle">Middle</button>
    <button id="v2End">End</button>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
